name: Release

# Push a tag like v0.1.0 to build both flavors and open a draft GitHub Release.
# The release stays a draft until a person installs the APK and publishes it.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NDK_VERSION: 27.1.12297006

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tag must point at a commit on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main. Release tags are created from main only."
            exit 1
          fi

      - name: Require signing secrets
        env:
          TETHER_KEYSTORE_BASE64: ${{ secrets.TETHER_KEYSTORE_BASE64 }}
          TETHER_KEYSTORE_PASSWORD: ${{ secrets.TETHER_KEYSTORE_PASSWORD }}
          TETHER_KEY_ALIAS: ${{ secrets.TETHER_KEY_ALIAS }}
          TETHER_KEY_PASSWORD: ${{ secrets.TETHER_KEY_PASSWORD }}
        run: |
          missing=0
          for name in TETHER_KEYSTORE_BASE64 TETHER_KEYSTORE_PASSWORD TETHER_KEY_ALIAS TETHER_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set. See docs/development.md section 11."
              missing=1
            fi
          done
          exit "$missing"

      - name: Tag must match the core version
        run: |
          core_version="$(sed -n 's/^version = "\([0-9.]*\)"$/\1/p' core/Cargo.toml | head -n 1)"
          if [ "v$core_version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match core/Cargo.toml version $core_version."
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo install cargo-ndk --locked --version "^4"
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;${{ env.NDK_VERSION }}
      - uses: gradle/actions/setup-gradle@v6

      - name: Decode the keystore
        env:
          TETHER_KEYSTORE_BASE64: ${{ secrets.TETHER_KEYSTORE_BASE64 }}
        run: |
          echo "$TETHER_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "TETHER_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build signed release artifacts
        env:
          TETHER_KEYSTORE_PASSWORD: ${{ secrets.TETHER_KEYSTORE_PASSWORD }}
          TETHER_KEY_ALIAS: ${{ secrets.TETHER_KEY_ALIAS }}
          TETHER_KEY_PASSWORD: ${{ secrets.TETHER_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleFullRelease bundlePlayRelease
        working-directory: android

      - name: Collect artifacts and checksums
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/full/release/*.apk "dist/tether-full-$GITHUB_REF_NAME.apk"
          cp android/app/build/outputs/bundle/playRelease/*.aab "dist/tether-play-$GITHUB_REF_NAME.aab"
          (cd dist && sha256sum * > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --draft --verify-tag --title "Tether $GITHUB_REF_NAME" --generate-notes
