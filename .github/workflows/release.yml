name: Release

# Publishes a signed GitHub Release on every merge to main that changes code (D34).
# tools/release-version.sh picks the version: a version in core/Cargo.toml with no tag yet is
# published as it is; otherwise the next patch after the newest tag. No manual tag, no draft.
# Skip one merge with "[skip release]" in the PR title, or stop all merges by setting the
# repository variable AUTO_RELEASE to false. Docs-only merges never release.
# Signing secrets: run `just release-signing` once (docs/development.md section 11).

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "tools/prototype/**"
      - ".github/**"
  workflow_dispatch:

permissions:
  contents: read

# One release at a time. A second push waits instead of racing the first.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  NDK_VERSION: 27.1.12297006

jobs:
  check:
    name: check
    if: >-
      github.ref == 'refs/heads/main' && github.repository == 'khanblair/tether' &&
      (github.event_name == 'workflow_dispatch' ||
      (vars.AUTO_RELEASE != 'false' && !contains(github.event.head_commit.message, '[skip release]')))
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      bump: ${{ steps.version.outputs.bump }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: version
        name: Pick the version to publish
        run: |
          tools/release-version.sh | tee -a "$GITHUB_OUTPUT"

  release:
    name: release
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      TAG: ${{ needs.check.outputs.tag }}
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Require signing secrets
        env:
          TETHER_KEYSTORE_BASE64: ${{ secrets.TETHER_KEYSTORE_BASE64 }}
          TETHER_KEYSTORE_PASSWORD: ${{ secrets.TETHER_KEYSTORE_PASSWORD }}
          TETHER_KEY_ALIAS: ${{ secrets.TETHER_KEY_ALIAS }}
          TETHER_KEY_PASSWORD: ${{ secrets.TETHER_KEY_PASSWORD }}
          TETHER_CERT_SHA256: ${{ vars.TETHER_CERT_SHA256 }}
        run: |
          missing=0
          for name in TETHER_KEYSTORE_BASE64 TETHER_KEYSTORE_PASSWORD TETHER_KEY_ALIAS TETHER_KEY_PASSWORD TETHER_CERT_SHA256; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret or variable $name is not set. Run 'just release-signing', then run this workflow again. See docs/development.md section 11."
              missing=1
            fi
          done
          exit "$missing"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: rustup toolchain install

      - name: Set the version in the build
        if: needs.check.outputs.bump == 'true'
        run: tools/bump-version.sh "$VERSION"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo install cargo-ndk --locked --version "^4"
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;${{ env.NDK_VERSION }}
      - uses: gradle/actions/setup-gradle@v6

      - name: Decode the keystore
        env:
          TETHER_KEYSTORE_BASE64: ${{ secrets.TETHER_KEYSTORE_BASE64 }}
        run: |
          echo "$TETHER_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "TETHER_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build signed release artifacts
        env:
          TETHER_KEYSTORE_PASSWORD: ${{ secrets.TETHER_KEYSTORE_PASSWORD }}
          TETHER_KEY_ALIAS: ${{ secrets.TETHER_KEY_ALIAS }}
          TETHER_KEY_PASSWORD: ${{ secrets.TETHER_KEY_PASSWORD }}
          TETHER_GITHUB_CLIENT_ID: ${{ vars.TETHER_GITHUB_CLIENT_ID }}
        run: ./gradlew --no-daemon assembleFullRelease bundlePlayRelease
        working-directory: android

      - name: Verify the APK is signed with the pinned key
        env:
          TETHER_CERT_SHA256: ${{ vars.TETHER_CERT_SHA256 }}
        run: |
          out="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs android/app/build/outputs/apk/full/release/app-full-release.apk)"
          echo "$out"
          actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' <<<"$out" | head -n 1)"
          if [ "$actual" != "$TETHER_CERT_SHA256" ]; then
            echo "::error::The APK is signed with a different key than the one pinned in TETHER_CERT_SHA256. Users could not update. Check the signing secrets."
            exit 1
          fi

      - name: Collect artifacts and checksums
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/full/release/app-full-release.apk "dist/tether-full-$TAG.apk"
          cp android/app/build/outputs/bundle/playRelease/app-play-release.aab "dist/tether-play-$TAG.aab"
          (cd dist && sha256sum * > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "Tether $TAG" --generate-notes --latest

      # Best effort: keep core/Cargo.toml equal to the newest tag. The release is already
      # published, and the next run works from the tags if this push is refused or loses a race.
      - name: Record the version in main
        if: needs.check.outputs.bump == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/Cargo.toml core/Cargo.lock
          git commit -m "chore: release $TAG [skip release]"
          git pull --rebase "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" main
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
