[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["fixtures/smells"]

[workspace.package]
version = "0.0.4"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace.dependencies]
tether-types = { path = "crates/tether-types" }
tether-engine = { path = "crates/tether-engine" }
tether-providers = { path = "crates/tether-providers" }
tether-store = { path = "crates/tether-store" }
rusqlite = { version = "0.43", features = ["bundled"] }
tether-secrets = { path = "crates/tether-secrets" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1.8.7"
sha2 = "0.10"
zstd = "0.14.4"
wasmtime = { version = "50", default-features = false, features = ["runtime", "cranelift"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "fs", "io-util"] }
tokio-util = "0.7"
zeroize = "1"
uniffi = "0.32"
ulid = "1.2"

[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
let_underscore_must_use = "warn"
# Allowed: product names such as PRoot, UniFFI, and SKILL.md appear in doc comments without backticks.
doc_markdown = "allow"
too_many_lines = "warn"
too_many_arguments = "warn"
cognitive_complexity = "warn"
excessive_nesting = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
opt-level = "s"
panic = "unwind"
