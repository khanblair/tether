[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["fixtures/smells"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace.dependencies]
tether-types = { path = "crates/tether-types" }
tether-engine = { path = "crates/tether-engine" }
uniffi = "0.32"

[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
let_underscore_must_use = "warn"
# Allowed: product names such as PRoot, UniFFI, and SKILL.md appear in doc comments without backticks.
doc_markdown = "allow"
too_many_lines = "warn"
too_many_arguments = "warn"
cognitive_complexity = "warn"
excessive_nesting = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
opt-level = "s"
panic = "unwind"
