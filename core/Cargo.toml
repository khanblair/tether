[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["fixtures/smells"]

[workspace.package]
version = "0.0.4"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace.dependencies]
tether-types = { path = "crates/tether-types" }
tether-engine = { path = "crates/tether-engine" }
tether-providers = { path = "crates/tether-providers" }
tether-store = { path = "crates/tether-store" }
rusqlite = { version = "0.43", features = ["bundled"] }
tether-secrets = { path = "crates/tether-secrets" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1.8.7"
sha2 = "0.11"
zstd = "0.14.4"
wasmtime = { version = "50", default-features = false, features = ["runtime", "cranelift"] }
wasmtime-wasi = { version = "50", default-features = false, features = ["p1"] }
ed25519-dalek = { version = "3", default-features = false }
wat = "1"
html2text = "0.16"
tree-sitter = "0.27"
tree-sitter-highlight = "0.27"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-go = "0.25"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-java = "0.23"
tree-sitter-swift = "0.7"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-php = "0.25"
tree-sitter-html = "0.23"
tree-sitter-css = "0.25"
tree-sitter-json = "0.24"
tree-sitter-yaml = "0.7"
tree-sitter-toml-ng = "0.7"
tree-sitter-md = "0.5"
tree-sitter-bash = "0.25"
similar = "3"
toml = "1"
tar = "0.4"
zip = { version = "9", default-features = false, features = ["deflate"] }
ignore = "0.4"
flate2 = "1"
portable-pty = "0.9"
tether-sandbox = { path = "crates/tether-sandbox" }
gix = { version = "0.90", default-features = false, features = ["blocking-network-client", "blocking-http-transport-reqwest-rust-tls", "status", "blob-diff", "worktree-mutation", "credentials", "index", "revision", "dirwalk", "sha1", "merge"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "fs", "io-util"] }
tokio-util = "0.7"
zeroize = "1"
uniffi = "0.32"
ulid = "1.2"

[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
let_underscore_must_use = "warn"
# Allowed: product names such as PRoot, UniFFI, and SKILL.md appear in doc comments without backticks.
doc_markdown = "allow"
too_many_lines = "warn"
too_many_arguments = "warn"
cognitive_complexity = "warn"
excessive_nesting = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
opt-level = "s"
panic = "unwind"
